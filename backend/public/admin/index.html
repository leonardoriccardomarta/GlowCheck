<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>GlowCheck Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #111111;
      --canvas: #f3f1ed;
      --muted: #6f6a67;
      --line: #e6e2dc;
      --card: #ffffff;
      --neon: #00e676;
      --red: #ff1744;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: Poppins, sans-serif; }
    body { min-height: 100svh; padding: 22px 18px calc(28px + env(safe-area-inset-bottom)); }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 18px; font-size: 14px; line-height: 1.4; }
    input, button, textarea {
      font: inherit; width: 100%; border-radius: 28px; border: 0; min-height: 52px; padding: 0 18px;
    }
    textarea { min-height: 220px; padding: 14px 18px; border-radius: 22px; resize: vertical; background: #fff; font-size: 12px; }
    input { background: var(--card); margin-bottom: 10px; }
    button { background: var(--ink); color: #fff; font-weight: 700; cursor: pointer; }
    button.ghost { background: var(--card); color: var(--ink); }
    button:disabled { opacity: 0.45; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .hits, .ideas { display: grid; gap: 8px; margin: 16px 0; }
    .hit, .idea {
      display: flex; gap: 12px; align-items: center;
      background: var(--card); border-radius: 22px; padding: 10px 12px;
      text-align: left; color: inherit; min-height: 72px;
    }
    .hit img, .ph {
      width: 56px; height: 56px; border-radius: 16px; object-fit: contain; background: var(--canvas); flex: none;
    }
    .hit b, .idea b { display: block; font-size: 14px; }
    .hit span, .idea span { color: var(--muted); font-size: 12px; }
    .slides { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0; }
    .slides canvas {
      width: 100%; height: auto; border-radius: 16px; background: #ddd;
      box-shadow: 0 10px 24px rgba(0,0,0,.12);
    }
    .slide-cap { font-size: 11px; color: var(--muted); margin: 8px 0 0; line-height: 1.35; }
    .ver-label {
      grid-column: 1 / -1; margin: 10px 0 0; font-size: 13px; font-weight: 800;
    }
    .err { color: var(--red); font-size: 13px; font-weight: 600; margin: 8px 0; }
    .ok { color: #128a4b; font-size: 13px; font-weight: 600; }
    h2 { font-size: 15px; margin: 22px 0 8px; }
    #gate, #app { max-width: 720px; margin: 0 auto; }
    #app { display: none; }
    #copybox { display: none; margin: 12px 0 18px; }
    #shotHost {
      position: fixed; left: -4200px; top: 0; width: 390px; pointer-events: none;
    }
    .phone {
      width: 390px; height: 693px; background: #F3F1ED; color: #111; overflow: hidden;
      font-family: Poppins, sans-serif; position: relative;
    }
    .status {
      position: absolute; inset: 0 0 auto 0; height: 44px; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 22px 0; color: #fff; font-size: 14px; font-weight: 600;
    }
    .status .pills { display: flex; gap: 6px; align-items: center; }
    .status .sig { width: 16px; height: 10px; border: 1.5px solid #fff; border-radius: 2px; position: relative; }
    .status .sig::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 5px; background: #fff; border-radius: 1px; }
    .status .sig i { display: block; height: 100%; width: 70%; background: #fff; }
    .header {
      background: linear-gradient(180deg, #111111 0%, var(--score) 100%);
      border-radius: 0 0 36px 36px;
      padding: 48px 16px 22px;
    }
    .nav { display: flex; align-items: center; justify-content: space-between; }
    .nav .right { display: flex; gap: 8px; }
    .circ {
      width: 42px; height: 42px; border-radius: 50%; background: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .circ svg { display: block; }
    .pname {
      margin: 12px 8px 0; text-align: center; color: rgba(255,255,255,.62);
      font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    }
    .ring-wrap { width: 156px; height: 156px; margin: 14px auto 0; position: relative; }
    .ring-wrap svg { width: 156px; height: 156px; transform: rotate(-90deg); }
    .ring-wrap .num {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 56px; font-weight: 800; line-height: 1;
    }
    .punch { color: #fff; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: .4px; line-height: 1.05; margin: 16px 8px 0; }
    .punch-sub { color: #fff; text-align: center; font-size: 16px; font-weight: 600; margin: 6px 12px 0; }
    .body { padding: 18px 18px 96px; }
    .counts { display: flex; gap: 8px; }
    .count {
      flex: 1; background: #fff; border-radius: 20px; padding: 14px 6px; text-align: center;
    }
    .count b { display: block; font-size: 22px; font-weight: 800; }
    .count span { display: block; margin-top: 2px; color: #6F6A67; font-size: 11px; font-weight: 700; }
    .card {
      background: #fff; border-radius: 22px; padding: 18px; margin-top: 12px;
    }
    .card h3 { margin: 0; font-size: 14px; font-weight: 700; }
    .card p { margin: 6px 0 0; color: #6F6A67; font-size: 13px; line-height: 1.45; }
    .inci-head { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 8px; }
    .inci-head b { font-size: 16px; }
    .inci-head span { color: #6F6A67; font-size: 12px; }
    .chips { display: flex; gap: 8px; margin-bottom: 8px; }
    .chip { background: #fff; border-radius: 24px; padding: 7px 12px; font-size: 12px; font-weight: 700; }
    .chip.on { background: #111; color: #fff; }
    .inci { background: #fff; border-radius: 24px; padding: 4px 16px 8px; margin-top: 12px; }
    .ing { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; }
    .tag {
      margin-top: 2px; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; letter-spacing: .3px;
      flex: none;
    }
    .ing strong { display: block; font-size: 13px; font-weight: 700; }
    .ing em { display: block; color: #6F6A67; font-size: 11px; font-style: normal; line-height: 1.35; margin-top: 2px; }
    .dock {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 8px 22px 22px; background: #F3F1ED;
    }
    .dock button {
      width: 100%; height: 56px; border: 0; border-radius: 40px; background: #111; color: #fff;
      font: 800 16px Poppins, sans-serif;
    }
    .homebar {
      width: 134px; height: 5px; border-radius: 99px; background: #111; margin: 10px auto 0;
    }
  </style>
</head>
<body>
  <div id="gate">
    <h1>GlowCheck Farm</h1>
    <p>Slideshow factory. Same INCI, four skins, zip for TikTok.</p>
    <input id="email" type="email" placeholder="Admin email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login">Enter</button>
    <p id="loginErr" class="err"></p>
  </div>
  <div id="app">
    <h1>TikTok farm</h1>
    <p>Unused viral ideas with INCI only. Cover is the real bottle on a studio slide. Two carousels per product: same hook + CTA, different skins in the middle.</p>
    <h2>Unused ideas</h2>
    <div id="ideas" class="ideas"></div>
    <div class="row">
      <input id="q" placeholder="Or search a product / barcode" />
      <button id="search" style="flex:0.45">Find</button>
    </div>
    <div id="hits" class="hits"></div>
    <p id="status"></p>
    <div id="copybox">
      <h2>Title + caption + slide text</h2>
      <textarea id="copyjson" readonly></textarea>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="useV1">Copy V1</button>
        <button class="ghost" id="useV2">Copy V2</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="copytitle">Copy title</button>
        <button class="ghost" id="copycap">Copy caption</button>
        <button class="ghost" id="copyjsonbtn">Copy JSON</button>
      </div>
    </div>
    <div id="board" class="slides" hidden></div>
    <button id="zip" hidden>Export 2 carousels (.zip)</button>
  </div>
  <div id="shotHost"></div>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const W = 1080, H = 1920;
    const INK = '#111111', CANVAS = '#F3F1ED', MUTED = '#6F6A67', NEON = '#00E676';
    let token = sessionStorage.getItem('glow_admin') || '';
    let pack = null;
    let selectedIdea = null;

    const $ = (id) => document.getElementById(id);
    function scoreColor(n) { return n >= 80 ? NEON : n >= 60 ? '#FF9100' : '#FF1744'; }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function api(path, body, method) {
      const res = await fetch(path, {
        method: method || 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
        },
        body: method === 'GET' ? undefined : JSON.stringify(body || {}),
      });
      const json = await res.json();
      if (!res.ok || json.ok === false) throw new Error(json.error || 'Request failed');
      return json;
    }

    function wrap(ctx, text, x, y, max, size, weight) {
      ctx.font = (weight || 800) + ' ' + size + 'px Poppins, sans-serif';
      const words = String(text || '').split(' ');
      let line = '', yy = y;
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > max && line) {
          ctx.fillText(line, x, yy);
          line = word;
          yy += size * 1.12;
        } else line = test;
      }
      if (line) ctx.fillText(line, x, yy);
      return yy;
    }

    function loadImg(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function farmImage(url) {
      if (!url) return null;
      const res = await fetch('/admin/farm/image?url=' + encodeURIComponent(url), {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (!res.ok) return null;
      const blob = await res.blob();
      return loadImg(URL.createObjectURL(blob));
    }

    function makeCanvas() {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      return c;
    }

    function drawImageCover(ctx, img, x, y, w, h) {
      const scale = Math.max(w / img.width, h / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    }

    function drawCover(img) {
      const c = makeCanvas();
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#111111';
      ctx.fillRect(0, 0, W, H);
      if (!img) return c;
      ctx.save();
      ctx.filter = 'blur(28px) saturate(1.35) brightness(0.72)';
      drawImageCover(ctx, img, -40, -40, W + 80, H + 80);
      ctx.restore();
      ctx.save();
      ctx.filter = 'contrast(1.12) saturate(1.14) brightness(1.03)';
      drawImageCover(ctx, img, 0, 0, W, H);
      ctx.restore();
      const vig = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.28, W / 2, H * 0.52, Math.min(W, H) * 0.9);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.28)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
      return c;
    }

    function cloneCanvas(src) {
      const c = document.createElement('canvas');
      c.width = src.width;
      c.height = src.height;
      c.getContext('2d').drawImage(src, 0, 0);
      return c;
    }

    async function drawCta() {
      const cta = await loadImg('/admin/cta.png?v=7');
      const c = makeCanvas();
      c.getContext('2d').drawImage(cta, 0, 0, W, H);
      return c;
    }

    function tagMeta(tag) {
      if (tag === 'watch') return { label: 'AVOID', color: '#FF1744', bg: 'rgba(255,23,68,.18)' };
      if (tag === 'fit') return { label: 'BENEFIT', color: '#00E676', bg: 'rgba(0,230,118,.18)' };
      return { label: 'NEUTRAL', color: '#6F6A67', bg: 'rgba(111,106,103,.16)' };
    }

    function scanHTML(product, row) {
      const color = scoreColor(row.score);
      const r = 67.5, c = 2 * Math.PI * r;
      const dash = (row.score / 100) * c;
      const lines = (row.lines && row.lines.length ? row.lines : []).slice(0, 2);
      const inci = lines.map((item) => {
        const meta = tagMeta(item.tag);
        return '<div class="ing"><span class="tag" style="color:' + meta.color + ';background:' + meta.bg + '">' +
          meta.label + '</span><div><strong>' + esc(item.name) + '</strong></div></div>';
      }).join('');
      return '<div class="phone" style="--score:' + color + '">' +
        '<div class="status"><span>9:41</span><div class="pills"><span class="sig"><i></i></span></div></div>' +
        '<div class="header">' +
          '<div class="nav">' +
            '<div class="circ"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#111111" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg></div>' +
            '<div class="right">' +
              '<div class="circ"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#111111" d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.41 6.41 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.11 0-2-.9-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .89 2 2z"/></svg></div>' +
              '<div class="circ"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#111111" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg></div>' +
            '</div>' +
          '</div>' +
          '<div class="pname">' + esc(String(product.name || '').toUpperCase()) + '</div>' +
          '<div class="ring-wrap">' +
            '<svg viewBox="0 0 156 156">' +
              '<circle cx="78" cy="78" r="67.5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="11"/>' +
              '<circle cx="78" cy="78" r="67.5" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
            '</svg>' +
            '<div class="num">' + esc(row.score) + '</div>' +
          '</div>' +
          '<div class="punch">' + esc(row.punch) + '</div>' +
          '<div class="punch-sub">' + esc(row.punchSub) + '</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="counts">' +
            '<div class="count"><b style="color:#FF1744">' + esc(row.watch) + '</b><span>Avoid</span></div>' +
            '<div class="count"><b style="color:#00E676">' + esc(row.fit) + '</b><span>Benefits</span></div>' +
            '<div class="count"><b style="color:#6F6A67">' + esc(row.listed) + '</b><span>Neutral</span></div>' +
          '</div>' +
          '<div class="card"><h3>Why this number</h3><p>' + esc(row.why || row.headline || '') + '</p></div>' +
          '<div class="card"><h3>Occlusion</h3><p>' + esc(row.occlusion || '') + '</p></div>' +
          (inci ? '<div class="inci">' + inci + '</div>' : '') +
        '</div>' +
        '<div class="dock"><button>Scan another bottle</button><div class="homebar"></div></div>' +
      '</div>';
    }

    async function captureScan(product, row) {
      const host = $('shotHost');
      host.innerHTML = scanHTML(product, row);
      await document.fonts.ready;
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const node = host.firstElementChild;
      const shot = await html2canvas(node, {
        width: 390,
        height: 693,
        scale: 3,
        backgroundColor: '#F3F1ED',
        useCORS: true,
        logging: false,
      });
      const c = makeCanvas();
      const ctx = c.getContext('2d');
      ctx.fillStyle = CANVAS;
      ctx.fillRect(0, 0, W, H);
      ctx.drawImage(shot, 0, 0, W, H);
      host.innerHTML = '';
      return c;
    }

    function slidesOf(cover, cta, a, b, script) {
      return [
        { name: '01-cover.png', canvas: cover, caption: script.slide_1_cover },
        { name: '02-score-' + a.id + '.png', canvas: a.canvas, caption: script.slide_2_first_skin_type.overlay_text },
        { name: '03-score-' + b.id + '.png', canvas: b.canvas, caption: script.slide_3_second_skin_type.overlay_text },
        { name: '04-cta.png', canvas: cta, caption: '' },
      ];
    }

    function appendSlides(board, label, items) {
      const h = document.createElement('p');
      h.className = 'ver-label';
      h.textContent = label;
      board.appendChild(h);
      items.forEach((item) => {
        const box = document.createElement('div');
        box.appendChild(item.canvas);
        if (item.caption) {
          const cap = document.createElement('p');
          cap.className = 'slide-cap';
          cap.textContent = item.caption;
          box.appendChild(cap);
        }
        board.appendChild(box);
      });
    }

    function setActiveScript(which) {
      if (!pack) return;
      pack.script = which === 2 ? pack.script2 : pack.script1;
      pack.version = which;
      $('copyjson').value = JSON.stringify(pack.script, null, 2);
    }

    async function render(product, scores, script1, script2, idea) {
      $('status').innerHTML = 'Finding a real pack shot…';
      const hero = await api('/admin/farm/hero', {
        query: [product.brand, product.name].filter(Boolean).join(' '),
        fallback: product.imageUrl,
      }).catch(() => ({ url: product.imageUrl, urls: [product.imageUrl] }));
      const candidates = [...new Set([...(hero.urls || []), hero.url, product.imageUrl].filter(Boolean))];
      let img = null;
      let pickedUrl = product.imageUrl || null;
      let bestPack = -1;
      for (const url of candidates.slice(0, 8)) {
        const next = await farmImage(url).catch(() => null);
        if (!next) continue;
        const aspect = next.width / next.height;
        if (aspect > 1.15 || aspect < 0.38) continue;
        const packScore = aspect <= 0.82 ? 2 : aspect <= 0.95 ? 1 : 0;
        if (packScore > bestPack || (packScore === bestPack && !img)) {
          bestPack = packScore;
          img = next;
          pickedUrl = url;
          if (packScore === 2) break;
        }
      }
      if (!img) {
        for (const url of candidates) {
          img = await farmImage(url).catch(() => null);
          if (img) {
            pickedUrl = url;
            break;
          }
        }
      }
      $('status').innerHTML = 'Building the cover with FLUX…';
      let cover = drawCover(img);
      if (pickedUrl) {
        try {
          const made = await api('/admin/farm/cover', {
            imageUrl: pickedUrl,
            name: [product.brand, product.name].filter(Boolean).join(' '),
          });
          if (made.image) {
            const pic = await loadImg(made.image);
            const c = makeCanvas();
            c.getContext('2d').drawImage(pic, 0, 0, W, H);
            cover = c;
          }
        } catch (e) {}
      }
      const cta = await drawCta();
      const ranked = [...scores].sort((a, b) => b.score - a.score);
      const scans = {};
      for (const row of scores) scans[row.id] = await captureScan(product, row);
      const v1a = ranked[0], v1b = ranked[ranked.length - 1];
      const rest = ranked.slice(1, -1);
      const v2a = rest[0] || ranked[0];
      const v2b = rest[1] || ranked[Math.min(1, ranked.length - 1)];
      const v1 = slidesOf(cover, cta, { ...v1a, canvas: scans[v1a.id] }, { ...v1b, canvas: scans[v1b.id] }, script1);
      const v2 = slidesOf(cover, cta, { ...v2a, canvas: scans[v2a.id] }, { ...v2b, canvas: scans[v2b.id] }, script2);
      pack = { product, idea, scores, script1, script2, script: script1, version: 1, v1, v2 };
      const board = $('board');
      board.hidden = false;
      board.innerHTML = '';
      appendSlides(board, 'Version 1 · ' + v1a.label + ' vs ' + v1b.label, v1);
      appendSlides(board, 'Version 2 · ' + v2a.label + ' vs ' + v2b.label, v2.map((item) => (
        item.name === '01-cover.png' || item.name === '04-cta.png'
          ? { ...item, canvas: cloneCanvas(item.canvas) }
          : item
      )));
      $('zip').hidden = false;
      $('copybox').style.display = 'block';
      setActiveScript(1);
    }

    async function build(hit) {
      $('status').innerHTML = 'Scoring four skins…';
      $('zip').hidden = true;
      try {
        const json = await api('/admin/farm/build', {
          name: hit.name,
          brand: hit.brand,
          imageUrl: hit.imageUrl,
          ingredients: hit.ingredients,
        });
        await render(json.product, json.scores, json.script, json.script2 || json.script, selectedIdea);
        $('status').innerHTML = '<span class="ok">Ready. Real scan screens + copy.</span>';
      } catch (e) {
        $('status').innerHTML = '<span class="err">' + e.message + '</span>';
      }
    }

    async function loadIdeas() {
      $('ideas').innerHTML = '<p>Checking unused viral products with INCI…</p>';
      try {
        const json = await api('/admin/farm/ideas', null, 'GET');
        const box = $('ideas');
        box.innerHTML = '';
        (json.ideas || []).forEach((idea) => {
          const b = document.createElement('button');
          b.className = 'idea';
          const inci = idea.product && idea.product.ingredients ? idea.product.ingredients.length : 0;
          b.innerHTML = '<div><b>' + esc(idea.label) + '</b><span>' + esc(idea.angle) + ' · ' + inci + ' INCI</span></div>';
          b.onclick = () => {
            selectedIdea = idea;
            $('q').value = idea.query;
            if (idea.product && idea.product.ingredients && idea.product.ingredients.length >= 2) {
              build(idea.product);
            } else {
              $('search').click();
            }
          };
          box.appendChild(b);
        });
        if (!json.ideas.length) box.innerHTML = '<p>All idea slots used. Search a new product.</p>';
      } catch (e) {
        $('ideas').innerHTML = '<p class="err">' + e.message + '</p>';
      }
    }

    function showHits(products) {
      $('hits').innerHTML = '';
      products.forEach((hit) => {
        const b = document.createElement('button');
        b.className = 'hit';
        const ready = hit.ingredients && hit.ingredients.length >= 2;
        b.disabled = !ready;
        b.innerHTML = (hit.imageUrl ? '<img alt="" src="' + hit.imageUrl + '">' : '<div class="ph"></div>') +
          '<div><b>' + esc(hit.name) + '</b><span>' + esc(hit.brand || '') + ' · ' + (hit.ingredients || []).length + ' INCI' + (ready ? '' : ' · missing INCI') + '</span></div>';
        if (ready) b.onclick = () => build(hit);
        $('hits').appendChild(b);
      });
    }

    $('login').onclick = async () => {
      $('loginErr').textContent = '';
      try {
        const json = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value }),
        }).then((r) => r.json());
        if (!json.ok) throw new Error(json.error === 'ADMIN_NOT_CONFIGURED' ? 'Set ADMIN_EMAIL and ADMIN_PASSWORD on the API.' : 'Login failed.');
        token = json.token;
        sessionStorage.setItem('glow_admin', token);
        $('gate').style.display = 'none';
        $('app').style.display = 'block';
        loadIdeas();
      } catch (e) {
        $('loginErr').textContent = e.message;
      }
    };

    $('search').onclick = async () => {
      $('hits').innerHTML = '';
      $('status').textContent = 'Looking up…';
      try {
        const json = await api('/admin/farm/lookup', { query: $('q').value });
        if (!json.products.length) {
          $('status').innerHTML = '<span class="err">No INCI / photo found.</span>';
          return;
        }
        $('status').textContent = json.products.length + ' products';
        showHits(json.products);
      } catch (e) {
        $('status').innerHTML = '<span class="err">' + e.message + '</span>';
      }
    };

    $('zip').onclick = async () => {
      if (!pack || !window.JSZip) return;
      const zip = new JSZip();
      for (const item of pack.v1) {
        const blob = await new Promise((resolve) => item.canvas.toBlob(resolve, 'image/png'));
        zip.file('v1/' + item.name, blob);
      }
      for (const item of pack.v2) {
        const blob = await new Promise((resolve) => item.canvas.toBlob(resolve, 'image/png'));
        zip.file('v2/' + item.name, blob);
      }
      zip.file('v1.json', JSON.stringify(pack.script1, null, 2));
      zip.file('v2.json', JSON.stringify(pack.script2, null, 2));
      const out = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(out);
      a.download = (pack.product.name || 'glowcheck').replace(/[^\w]+/g, '-').slice(0, 40) + '-carousel.zip';
      a.click();
      const keys = [pack.product.name];
      if (pack.idea) keys.push(pack.idea.id, pack.idea.query, pack.idea.label);
      Promise.all(keys.map((key) => api('/admin/farm/used', { key, label: pack.product.name }))).then(loadIdeas);
    };

    $('useV1').onclick = () => setActiveScript(1);
    $('useV2').onclick = () => setActiveScript(2);
    $('copytitle').onclick = () => {
      if (pack && pack.script) navigator.clipboard.writeText(pack.script.post_title);
    };
    $('copycap').onclick = () => {
      if (pack && pack.script) navigator.clipboard.writeText(pack.script.tiktok_caption);
    };
    $('copyjsonbtn').onclick = () => {
      if (pack && pack.script) navigator.clipboard.writeText(JSON.stringify(pack.script, null, 2));
    };

    $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('search').click(); });
    $('q').addEventListener('input', () => {
      if (selectedIdea && $('q').value !== selectedIdea.query) selectedIdea = null;
    });
    if (token) { $('gate').style.display = 'none'; $('app').style.display = 'block'; loadIdeas(); }
  </script>
</body>
</html>
