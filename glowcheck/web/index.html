<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GlowCheck. Scan INCI vs your skin.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GlowCheck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GlowCheck</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background: #F3F1ED;
    }
    #glow-root {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      height: 100svh;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      overflow: hidden;
    }
    #glow-html-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2147483646;
    }
    flutter-view input:not(.glow-html-input),
    flt-semantics input,
    .flt-semantics input,
    input.flt-text-editing {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('assets/fonts/Poppins-Regular.ttf') format('truetype'),
           url('assets/assets/fonts/Poppins-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('assets/fonts/Poppins-Bold.ttf') format('truetype'),
           url('assets/assets/fonts/Poppins-Bold.ttf') format('truetype');
    }
    input.glow-html-input,
    input.glow-html-input::placeholder {
      font-family: 'Poppins', sans-serif !important;
      font-size: 14px !important;
      font-weight: 400 !important;
      letter-spacing: 0 !important;
      -webkit-font-smoothing: antialiased;
    }
    input.glow-html-input {
      position: fixed !important;
      background: #ffffff !important;
      background-color: #ffffff !important;
      color: #111111 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      outline: none !important;
      -webkit-appearance: none !important;
      appearance: none !important;
      pointer-events: auto;
      opacity: 1;
    }
    input.glow-html-input.is-secret {
      -webkit-text-security: disc;
    }
    input.glow-html-input.is-hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      left: -4000px !important;
    }
    input.glow-html-input::placeholder {
      color: #9A9590 !important;
      opacity: 1 !important;
    }
    input.glow-html-input:-webkit-autofill,
    input.glow-html-input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: #111111 !important;
    }
    video.glow-cam-video {
      position: fixed !important;
      object-fit: cover;
      background: #111111;
      pointer-events: none;
      z-index: 2147483645;
    }
    video.glow-cam-video.is-hidden,
    .glow-cam-frame.is-hidden,
    .glow-cam-chrome.is-hidden {
      display: none !important;
    }
    .glow-cam-frame {
      position: fixed;
      pointer-events: none;
      box-sizing: border-box;
      border: 2px solid rgba(255,255,255,0.88);
      border-radius: 18px;
      z-index: 2147483646;
    }
    .glow-cam-chrome {
      position: fixed;
      pointer-events: none;
      z-index: 2147483647;
    }
    .glow-cam-btn,
    .glow-cam-shutter {
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
      padding: 0;
      cursor: pointer;
    }
    .glow-cam-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 22px;
      line-height: 44px;
      text-align: center;
    }
    .glow-cam-close { top: 12px; left: 16px; }
    .glow-cam-badge {
      position: absolute;
      top: 16px;
      left: 68px;
      right: 16px;
      padding: 8px 12px;
      border-radius: 99px;
      background: #00E676;
      color: #111111;
      font-family: Poppins, sans-serif;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      pointer-events: none;
    }
    .glow-cam-badge.is-hidden { display: none !important; }
    .glow-cam-gallery { left: 8px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .glow-cam-flash { right: 8px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
    .glow-cam-flash.is-on { background: #00E676; color: #111111; }
    .glow-cam-shutter {
      position: absolute;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      box-sizing: border-box;
      padding: 5px;
    }
    .glow-cam-shutter::after {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
    }
  </style>
</head>
<body>
  <div id="glow-root"></div>
  <div id="glow-html-layer"></div>
  <script>
    (function () {
      var lastH = -1;
      var lastTop = -1;
      var fitting = false;
      function visibleHeight() {
        var heights = [window.innerHeight];
        if (window.visualViewport && window.visualViewport.height) {
          heights.push(window.visualViewport.height);
        }
        if (document.documentElement && document.documentElement.clientHeight) {
          heights.push(document.documentElement.clientHeight);
        }
        return Math.round(Math.min.apply(null, heights.filter(Boolean)));
      }
      function typing() {
        var el = document.activeElement;
        return el && el.classList && el.classList.contains('glow-html-input');
      }
      function fit() {
        if (fitting || typing()) return;
        var root = document.getElementById('glow-root');
        if (!root) return;
        var vv = window.visualViewport;
        var top = vv && vv.offsetTop ? Math.round(vv.offsetTop) : 0;
        var h = visibleHeight();
        if (h === lastH && top === lastTop) return;
        lastH = h;
        lastTop = top;
        fitting = true;
        root.style.position = 'fixed';
        root.style.left = '0';
        root.style.right = '0';
        root.style.top = top + 'px';
        root.style.height = h + 'px';
        root.style.paddingTop = 'env(safe-area-inset-top, 0px)';
        root.style.boxSizing = 'border-box';
        fitting = false;
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('pageshow', fit);
      window.addEventListener('orientationchange', function () {
        setTimeout(fit, 80);
      });
      window.addEventListener('flutter-first-frame', fit);
      document.addEventListener('visibilitychange', fit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fit);
        window.visualViewport.addEventListener('scroll', fit);
      }
      [50, 150, 400, 900].forEach(function (ms) { setTimeout(fit, ms); });
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="glow_cam.js"></script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine({
          hostElement: document.getElementById('glow-root'),
        });
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
