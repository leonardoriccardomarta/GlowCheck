<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="GlowCheck. Scan INCI vs your skin.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GlowCheck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GlowCheck</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: #F3F1ED;
      position: fixed;
      inset: 0;
    }
    flt-glass-pane,
    flutter-view,
    flt-scene-host {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      function pin() {
        var vp = window.visualViewport;
        var h = vp ? vp.height : window.innerHeight;
        var top = vp ? vp.offsetTop : 0;
        document.documentElement.style.setProperty('--app-height', h + 'px');
        ['flt-glass-pane', 'flutter-view', 'flt-scene-host'].forEach(function (name) {
          document.querySelectorAll(name).forEach(function (el) {
            el.style.position = 'fixed';
            el.style.left = '0';
            el.style.right = '0';
            el.style.top = top + 'px';
            el.style.height = h + 'px';
            el.style.width = '100%';
          });
        });
      }
      window.addEventListener('resize', pin);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', pin);
        window.visualViewport.addEventListener('scroll', pin);
      }
      new MutationObserver(pin).observe(document.documentElement, { childList: true, subtree: true });
      pin();
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
