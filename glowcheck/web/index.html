<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GlowCheck. Scan INCI vs your skin.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GlowCheck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GlowCheck</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
      background: #F3F1ED;
    }
    #glow-root {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100svh;
      overflow: hidden;
    }
    input, textarea {
      background: #ffffff !important;
      background-color: #ffffff !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      outline: none !important;
      -webkit-appearance: none !important;
      appearance: none !important;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      -webkit-text-fill-color: #111111 !important;
    }
  </style>
</head>
<body>
  <div id="glow-root"></div>
  <script>
    (function () {
      function visibleHeight() {
        var heights = [window.innerHeight];
        if (window.visualViewport && window.visualViewport.height) {
          heights.push(window.visualViewport.height);
        }
        if (document.documentElement && document.documentElement.clientHeight) {
          heights.push(document.documentElement.clientHeight);
        }
        return Math.round(Math.min.apply(null, heights.filter(Boolean)));
      }
      function fit() {
        var root = document.getElementById('glow-root');
        if (!root) return;
        root.style.height = visibleHeight() + 'px';
        window.dispatchEvent(new Event('resize'));
      }
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('pageshow', fit);
      window.addEventListener('orientationchange', function () {
        setTimeout(fit, 80);
      });
      window.addEventListener('flutter-first-frame', fit);
      document.addEventListener('visibilitychange', fit);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fit);
      }
      [50, 150, 400, 900].forEach(function (ms) { setTimeout(fit, ms); });
    })();
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine({
          hostElement: document.getElementById('glow-root'),
        });
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
